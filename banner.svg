<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9c9c9"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- dot grid top-left -->
  <g fill="#d6d6d6">
    <circle cx="60" cy="40" r="3"/>
    <circle cx="90" cy="40" r="3"/>
    <circle cx="120" cy="40" r="3"/>
    <circle cx="150" cy="40" r="3"/>
    <circle cx="60" cy="70" r="3"/>
    <circle cx="90" cy="70" r="3"/>
    <circle cx="120" cy="70" r="3"/>
    <circle cx="150" cy="70" r="3"/>
    <circle cx="60" cy="100" r="3"/>
    <circle cx="90" cy="100" r="3"/>
    <circle cx="120" cy="100" r="3"/>
    <circle cx="150" cy="100" r="3"/>
  </g>

  <!-- decorative lines top-left -->
  <path d="M20 20 L220 20" stroke="#ff5c8a" stroke-width="2"/>
  <path d="M20 20 L20 90" stroke="#ff5c8a" stroke-width="2"/>
  <path d="M180 60 L260 60" stroke="#ff5c8a" stroke-width="2"/>

  <!-- decorative circles bottom-right -->
  <circle cx="1080" cy="220" r="70" fill="none" stroke="#ffb3c6" stroke-width="1.5"/>
  <circle cx="1130" cy="260" r="40" fill="none" stroke="#a3c9ff" stroke-width="1.5"/>
  <path d="M950 250 L1150 250" stroke="#ffb3c6" stroke-width="1"/>
  <path d="M1000 180 L1000 280" stroke="#a3c9ff" stroke-width="1"/>

  <!-- small purple square accent -->
  <rect x="560" y="90" width="14" height="14" fill="#7c6cf6"/>
  <path d="M600 97 L640 97" stroke="#ff5c8a" stroke-width="2"/>
  <path d="M660 90 L680 105 L660 120 Z" fill="#ff5c8a"/>

  <!-- Name and title -->
  <text x="600" y="150" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#111111" text-anchor="middle">YOUR NAME</text>
  <text x="600" y="178" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#555555" text-anchor="middle">DATA ANALYST | SQL DEVELOPER</text>
  <text x="600" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#777777" text-anchor="middle">your.email@example.com  |  GITHUB @yourusername</text>

</svg>
